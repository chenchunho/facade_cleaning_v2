# ~/.config/systemd/user/fcv-body.service.d/endpoints.conf  (body "washrobot", 192.168.1.100)
# fcv-body.service hard-codes FCV_EP_CRANE_HOST=192.168.5.25 (bench crane WiFi). When that env
# is set the body does NOT probe the wired address, so it must be overridden here — otherwise
# the body keeps knocking on the test crane forever (seen 2026-09-19: crane_peer_fresh=0).
[Service]
Environment=FCV_EP_CRANE_HOST=192.168.1.10
