# /etc/systemd/system/fcv-crane.service.d/endpoints.conf  (official-crane, 192.168.1.10)
# One binary serves both cranes: every official-specific value lives here, defaults in the
# code are the test crane (raspberry-cran) so that machine needs no drop-in at all.
# See config/official-crane_485.md for the device map these values encode.
[Service]
ExecStartPre=/home/nexuni/run/wait_devices.sh
Environment=FCV_EP_USR_A_HOST=192.168.1.30
Environment=FCV_EP_USR_B_HOST=192.168.1.31
Environment=FCV_EP_DSZL_L_HOST=192.168.1.33
Environment=FCV_EP_USR_M_HOST=192.168.1.34
Environment=FCV_EP_USR_M2_HOST=192.168.1.32
Environment=FCV_EP_USR_W_HOST=192.168.1.35
Environment=FCV_METER_LEFT_GW=M
Environment=FCV_METER_LEFT_SLAVE=1
Environment=FCV_METER_RIGHT_GW=M2
Environment=FCV_METER_RIGHT_SLAVE=2
Environment=FCV_METER_MIDDLE_GW=M2
Environment=FCV_METER_MIDDLE_SLAVE=1
Environment=FCV_METER_MIDDLE_ENABLE=1
Environment=FCV_WATER_INLET_CH=1
Environment=FCV_DSZL_SCALE_LEFT=0.0075758
Environment=FCV_DSZL_SCALE_RIGHT=0.008547
