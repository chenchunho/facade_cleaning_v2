# /etc/systemd/system/fcv-crane.service.d/middle.conf  (official-crane)  [2026-10-08]
# Middle-winch CLV900 (clvdrives 900-0007M1 mini + 485 expansion card) on its own USR .36
# (MAC d4:ad:20:a2:a5:2a), slave 3 (F7-00), 115200 8N1 (F7-01=4 / F7-02=3).
# This only brings up comms + manual middle_hold. Auto-follow (middle rope moves with pay_out /
# retract / goto / two-side ▲▼) is the persisted setting `set_middle_auto 1` — turn it on only after
# the on-site direction check (a short middle_hold; flip with set_middle_dir_invert if needed).
[Service]
Environment=FCV_CLV900_ENABLE=1
Environment=FCV_EP_USR_MW_HOST=192.168.1.36
Environment=FCV_CLV900_SLAVE=3
