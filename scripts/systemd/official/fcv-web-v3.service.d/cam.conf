# /etc/systemd/system/fcv-web-v3.service.d/cam.conf  (official-crane)  [2026-10-08]
# Dashboard cameras: the browser loads them straight from the body's fcv-cam (:8091). The default CAM_BASE is
# http://$WROBOT_IP:8091 = http://192.168.1.100:8091 (body eth0 behind the WiFi bridge), which a browser on the
# warehouse WiFi (192.168.5.x) cannot reach -> point it at the body's WiFi address.
# 🔴 Warehouse-specific (body WiFi DHCP, can drift). On site, use whatever address the operator's device can reach.
[Service]
Environment=CAM_BASE=http://192.168.5.26:8091
